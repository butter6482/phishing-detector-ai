[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
loglevel=info

[program:uvicorn]
command=python -m uvicorn api:app --host 127.0.0.1 --port 8000
directory=/app
user=appuser
autostart=true
autorestart=true
startsecs=2
stopsignal=TERM
stdout_logfile=/tmp/uvicorn.log
stderr_logfile=/tmp/uvicorn.err

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=2
stdout_logfile=/tmp/nginx.log
stderr_logfile=/tmp/nginx.err

