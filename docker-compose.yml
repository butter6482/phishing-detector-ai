version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: phishing-detector
    container_name: phishing-detector
    ports:
      - "8080:80"
    environment:
      - USE_OPENROUTER=${USE_OPENROUTER:-true}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-openai/gpt-3.5-turbo}
      - GOOGLE_SAFE_BROWSING_KEY=${GOOGLE_SAFE_BROWSING_KEY:-}
    env_file:
      - .env
