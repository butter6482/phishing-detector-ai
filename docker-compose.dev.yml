version: "3.9"
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    container_name: phishing-backend
    env_file: ./.env
    ports:
      - "8000:8000"


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: phishing-frontend-dev
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - backend
